name: Vérifications SambaPilot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: make check demo demo-backup PYTHON=python
      - name: Exécuter la suite et produire son bilan
        run: |
          mkdir -p artifacts/verification
          python -B scripts/run_tests.py --report artifacts/verification/python.json
      - name: Conserver le bilan des tests Python
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sambapilot-tests-python-${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/python.json
          if-no-files-found: warn
          retention-days: 30

  native:
    name: GTK4 et testparm réels sur Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Dépendances du runner éphémère uniquement ; aucune installation locale.
      - name: Préparer le runner Linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-gtk-4.0 xvfb xauth dbus-x11 samba-common-bin
          sudo install -d -m 0755 /run/samba /var/lib/samba /var/cache/samba
      - name: Exécuter les tests GTK4 et Samba avec les tests ordinaires
        env:
          SAMBAPILOT_GTK_TESTS: '1'
          SAMBAPILOT_SAMBA_TESTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          mkdir -p artifacts/verification
          xvfb-run -a dbus-run-session -- /usr/bin/python3 -B scripts/run_tests.py --require-native --report artifacts/verification/native.json
      - name: Conserver le bilan des tests natifs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sambapilot-tests-native-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/native.json
          if-no-files-found: warn
          retention-days: 30

  profiles:
    name: Profil Linux ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: arch
            image: archlinux:base-devel
          - family: debian
            image: debian:13
          - family: fedora
            image: fedora:44
    container: ${{ matrix.image }}
    steps:
      # Installations limitées aux conteneurs temporaires de la CI.
      - name: Préparer les dépendances du conteneur
        shell: bash
        run: |
          case '${{ matrix.family }}' in
            arch)
              pacman -Syu --noconfirm --needed python python-gobject gtk4 samba make git xorg-server-xvfb dbus python-build python-setuptools python-wheel python-pip
              ;;
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-gi gir1.2-gtk-4.0 samba-common-bin make git xvfb dbus-daemon python3-build python3-setuptools python3-wheel python3-venv
              ;;
            fedora)
              dnf install -y python3 python3-gobject gtk4 samba-common-tools make git xorg-x11-server-Xvfb dbus-daemon python3-build python3-setuptools python3-wheel python3-pip
              ;;
          esac
          mkdir -p /run/samba /var/lib/samba /var/cache/samba
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Vérifier les profils et les suites natives
        shell: bash
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          DISPLAY: ':99'
        run: |
          make check PYTHON=python3
          python3 -B scripts/check_linux_profile.py --expected '${{ matrix.family }}'
          mkdir -p artifacts/verification
          Xvfb :99 -screen 0 1280x1024x24 -ac -nolisten tcp > artifacts/verification/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          dbus-run-session -- python3 -B scripts/run_tests.py --require-native --report artifacts/verification/profile.json
          python3 -m build --no-isolation --outdir "$RUNNER_TEMP/sambapilot-profile-dist"
          python3 -B scripts/check_distribution.py "$RUNNER_TEMP/sambapilot-profile-dist"
          python3 -m venv --system-site-packages "$RUNNER_TEMP/sambapilot-profile-venv"
          "$RUNNER_TEMP/sambapilot-profile-venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/sambapilot-profile-dist/"*.whl
          cd "$RUNNER_TEMP"
          installed_status=0
          dbus-run-session -- "$RUNNER_TEMP/sambapilot-profile-venv/bin/python" -I -B "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --gtk > "$GITHUB_WORKSPACE/artifacts/verification/installed.log" 2>&1 || installed_status=$?
          cat "$GITHUB_WORKSPACE/artifacts/verification/installed.log"
          exit "$installed_status"
      - name: Conserver le bilan du profil Linux
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sambapilot-tests-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Distribution Python
    needs: [python, native, profiles]
    outputs:
      python_artifact_id: ${{ steps.upload_python.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Construire les sources puis le wheel depuis les sources
        run: |
          python -m pip install build
          python -m build
          python -B scripts/check_distribution.py dist
      - name: Vérifier le paquet installé hors du dépôt
        run: |
          python -m venv "$RUNNER_TEMP/sambapilot-package"
          "$RUNNER_TEMP/sambapilot-package/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sambapilot-package/bin/python" -I -B "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - name: Identifier les archives Python
        run: |
          git rev-parse HEAD > dist/COMMIT.txt
          cd dist
          sha256sum *.whl *.tar.gz COMMIT.txt > SHA256SUMS
      - name: Conserver les archives Python vérifiées
        id: upload_python
        uses: actions/upload-artifact@v7
        with:
          name: sambapilot-python-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Paquet Arch Linux
    needs: package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Préparer les outils dans le conteneur temporaire
        run: pacman -Syu --noconfirm --needed python-build python-installer python-setuptools python-wheel gtk4 python-gobject git desktop-file-utils
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.python_artifact_id }}
          merge-multiple: true
          path: dist/
      - name: Vérifier les archives reçues
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(cat COMMIT.txt)" = "$GITHUB_SHA"
      - name: Préparer et construire sans droits administrateur
        env:
          BUILD_REVISION: ${{ github.run_number }}
        run: |
          python -B scripts/prepare_arch_build.py --source dist/*.tar.gz --output "$RUNNER_TEMP/sambapilot-arch" --pkgrel "$BUILD_REVISION"
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$RUNNER_TEMP/sambapilot-arch"
          runuser -u builder -- bash -c 'cd "$1" && makepkg --noconfirm --cleanbuild' _ "$RUNNER_TEMP/sambapilot-arch"
      - name: Vérifier le paquet dans le conteneur
        run: |
          pacman -U --noconfirm "$RUNNER_TEMP/sambapilot-arch/"*.pkg.tar.zst
          cd "$RUNNER_TEMP"
          desktop-file-validate /usr/share/applications/io.github.sambapilot.SambaPilot.desktop
          /usr/bin/python -I -B "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - name: Préparer les fichiers téléchargeables
        run: |
          mkdir -p artifacts/arch
          cp "$RUNNER_TEMP/sambapilot-arch/"*.pkg.tar.zst artifacts/arch/
          cp "$RUNNER_TEMP/sambapilot-arch/PKGBUILD" artifacts/arch/
          cp dist/COMMIT.txt artifacts/arch/
          cd artifacts/arch
          sha256sum *.pkg.tar.zst PKGBUILD COMMIT.txt > SHA256SUMS
      - name: Conserver le paquet Arch vérifié
        uses: actions/upload-artifact@v7
        with:
          name: sambapilot-arch-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/arch/
          if-no-files-found: error
          retention-days: 30
